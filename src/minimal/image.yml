env:
  KERNEL_FLAVOUR: 6.18

modules:
  - name: Set repos
    type: repos
    body:
      clean: true
      custom:
        - rpm [alt] http://ftp.altlinux.org/pub/distributions/archive/sisyphus/date/${{ Env.YEAR }}/${{ Env.MONTH }}/${{ Env.DAY }} _arch_ classic
        - rpm [alt] http://ftp.altlinux.org/pub/distributions/archive/sisyphus/date/${{ Env.YEAR }}/${{ Env.MONTH }}/${{ Env.DAY }} noarch classic

  - name: Set arepo
    type: repos
    if: Arch == 'x86_64'
    body:
      no-update: true
      custom:
        - rpm [alt] http://ftp.altlinux.org/pub/distributions/archive/sisyphus/date/${{ Env.YEAR }}/${{ Env.MONTH }}/${{ Env.DAY }} x86_64-i586 classic

  - name: Initial includes
    type: include
    body:
      targets:
        - apt-rpm.yml
        - openssl.yml
        - filesystem.yml

  - type: packages
    body:
      update: true
      upgrade: true

  - name: Set branding
    type: branding
    body:
      name: alt-atomic-${{ Env.IMAGE_NAME }}
      build-type: ${{ Env.IMAGE_TYPE }}
      release-overrides:
        VERSION: ${{ Env.VERSION }}
        VARIANT: Core Minimal
        VARIANT_ID: core-minimal

  - name: Install packages
    type: include
    body:
      targets:
        - packages.yml

  - name: Copy root
    type: copy
    body:
      source: root
      destination: /
      replace: true

  - name: Settings image
    type: include
    body:
      targets:
        - disable-bins.yml
        - network.yml
        - settings.yml
        - passwd.yml
        - systemd.yml

  - name: Configurate grub
    type: shell
    env:
      ARCH: ${{ Arch }}
    body:
      command: scripts/grub.sh

  - name: Update kernel
    type: kernel
    body:
      kernel-info:
        flavour: ${{ Env.KERNEL_FLAVOUR }}
        modules:
          - drm
      initrd:
        method: dracut

  - name: Cleanup
    type: include
    body:
      targets:
        - /usr/share/apm/includes/common/cleanup.yml
