env:
  KERNEL_FLAVOUR: 6.18

modules:
  - name: Set repos
    type: repos
    body:
      clean: true
      custom:
        - rpm [alt] http://ftp.altlinux.org/pub/distributions/archive/sisyphus/date/${{ Env.YEAR }}/${{ Env.MONTH }}/${{ Env.DAY }} _arch_ classic
        - rpm [alt] http://ftp.altlinux.org/pub/distributions/archive/sisyphus/date/${{ Env.YEAR }}/${{ Env.MONTH }}/${{ Env.DAY }} noarch classic

  - name: Set arepo
    type: repos
    if: Arch == 'x86_64'
    body:
      no-update: true
      custom:
        - rpm [alt] http://ftp.altlinux.org/pub/distributions/archive/sisyphus/date/${{ Env.YEAR }}/${{ Env.MONTH }}/${{ Env.DAY }} x86_64-i586 classic

  - name: Initial includes
    type: include
    body:
      targets:
        - apt-rpm.yml
        - openssl.yml
        - filesystem.yml

  - type: packages
    body:
      update: true
      upgrade: true

  - name: Set branding
    type: branding
    body:
      name: alt-atomic-${{ Env.IMAGE_NAME }}
      build-type: ${{ Env.IMAGE_TYPE }}
      release-overrides:
        VERSION_ID: ${{ Env.VERSION }}
        VARIANT: Minimal
        VARIANT_ID: minimal
      metainfo:
        summary:
          C: ALT Atomic base image (${{ Env.IMAGE_TYPE }})
          ru: Базовый образ ALT Atomic (${{ Env.IMAGE_TYPE }})
        description:
          C: |
            <p>Doesn't contain a desktop environment.</p>
            <p>Not designed for end use.</p>
          ru: |
            <p>Не содержит окружения рабочего стола.</p>
            <p>Не предназначен для конечного использования.</p>
        variants:
          - image: altlinux.space/alt-atomic/core-minimal/${{ Env.IMAGE_TYPE }}:latest
            name:
              C: ALT Atomic Core Minimal
              ru: ALT Atomic Core Минимальный
            summary:
              C: Minimal variant of Core image
              ru: Минимальный вариант Core образа
            description:
              C: |
                <p>It contains only the essentials and may require improvements to work on real hardware.</p>
                <p>Doesn't contain Linux firmware.</p>
              ru: |
                <p>Он содержит только самое необходимое и может требовать доработок для работы на реальном железе.</p>
                <p>Не содержит прошивки Linux.</p>
          - image: altlinux.space/alt-atomic/core/${{ Env.IMAGE_TYPE }}:latest
            name:
              C: ALT Atomic Core
              ru: ALT Atomic Core
            summary:
              C: Default variant of Core image
              ru: Обычный вариант Core образа
            description:
              C: |
                <p>The minimum image that can already be run on hardware.</p>
                <p>It is a recommended base for end-user images.</p>
              ru: |
                <p>Минимальный образ, который уже можно запустить на оборудовании.</p>
                <p>Это рекомендуемая основа для образов конечных пользователей.</p>

  - name: Install packages
    type: include
    body:
      targets:
        - packages.yml

  - name: Copy root
    type: copy
    body:
      source: root
      destination: /
      replace: true

  - name: Settings image
    type: include
    body:
      targets:
        - disable-bins.yml
        - network.yml
        - settings.yml
        - passwd.yml
        - systemd.yml

  - name: Configurate grub
    type: shell
    env:
      ARCH: ${{ Arch }}
    body:
      command: scripts/grub.sh

  - name: Update kernel
    type: kernel
    body:
      kernel-info:
        flavour: ${{ Env.KERNEL_FLAVOUR }}
        modules:
          - drm
      initrd:
        method: dracut

  - name: Cleanup
    type: include
    body:
      targets:
        - /usr/share/apm/includes/common/cleanup.yml
