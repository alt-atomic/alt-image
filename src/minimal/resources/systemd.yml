modules:
  - type: systemd
    body:
      targets:
        - bootloader-update
        - chrony
        - fstrim.timer
        - locked-db-migrate.service
        - systemd-resolved
        - NetworkManager
        - ostree-remount
        - podman.socket
        - sync-users.service
      enabled: true

  - name: Enabling dbus-broker for system and user buses
    type: shell
    body:
      command: |
        systemctl enable --force dbus-broker.service
        systemctl --global enable --force dbus-broker.service
