#
# Allow systemd-oomd to kill system services when the host runs out of
# memory/swap. Individual units can opt out via ManagedOOMPreference= or
# by setting ManagedOOMSwap=no / ManagedOOMMemoryPressure=no.

[Slice]
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=kill
