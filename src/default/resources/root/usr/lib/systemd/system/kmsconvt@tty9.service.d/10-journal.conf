[Unit]
Description=System journal on %I
After=getty@%i.service
ConditionVirtualization=!container
ConditionVirtualization=vm
# Keep a failed journal viewer from falling back to a login prompt.
OnFailure=
Conflicts=debug-shell.service
After=debug-shell.service

[Service]
ExecStart=
ExecStart=/usr/bin/kmscon --vt=%I --no-switchvt --oneshot --login -- /usr/bin/journalctl --boot --follow --no-pager
Restart=always
RestartSec=2s
