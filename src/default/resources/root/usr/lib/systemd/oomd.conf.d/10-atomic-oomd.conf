#
# ALT Atomic default systemd-oomd configuration.
#
# Swap is provided by zram, so the default 90% threshold is too late:
# the kernel OOM killer will step in earlier. Lower the limits so that
# systemd-oomd can act before the system becomes completely unresponsive.

[OOM]
SwapUsedLimit=80%
DefaultMemoryPressureLimit=40%
DefaultMemoryPressureDurationSec=10s
