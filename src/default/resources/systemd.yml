modules:
  - type: systemd
    body:
      targets:
        - libvirtd
        - docker.socket
        - systemd-oomd
      enabled: true

  - name: Enable journal consoles
    type: systemd
    body:
      targets:
        - kmsconvt@tty12.service
        - kmsconvt@tty9.service
      enabled: true
