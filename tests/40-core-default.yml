name: core defaults
description: What core adds on top of core-minimal
only:
  VERSION_ID: [ "~^[0-9]+$" ]
steps:
  - name: zram is active
    run: swapon --noheadings --show=NAME,TYPE
    expect:
      stdout: zram0
    on-fail: systemctl status systemd-zram-setup@zram0 --no-pager; cat /etc/systemd/zram-generator.conf

  - name: systemd-oomd runs with our limits
    run: oomctl
    expect:
      stdout: "Swap Used Limit: 80"
    on-fail: systemctl status systemd-oomd --no-pager; cat /usr/lib/systemd/oomd.conf.d/10-atomic-oomd.conf

  - name: sudo for wheel is enabled
    run: control sudowheel
    expect:
      stdout: enabled

  - name: firmware-linux is installed
    run: rpm -q firmware-linux

  - name: user namespaces are allowed
    run: sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || sysctl -n user.max_user_namespaces
    expect:
      stdout: "~^[1-9]"

  - name: default services are enabled
    only:
      VERSION_ID: [ "~^[0-9]+$" ]
    run: systemctl is-enabled libvirtd docker.socket systemd-oomd
    on-fail: systemctl status libvirtd docker.socket systemd-oomd --no-pager | head -60

  - name: journal consoles are enabled
    run: systemctl is-enabled kmsconvt@tty12.service kmsconvt@tty9.service

  - name: journal runs on the console selected for this machine
    run: |
      # Containers and serial-only machines cannot run a VT console.
      if systemd-detect-virt --container --quiet || ! test -c /dev/tty0; then
        exit 0
      fi
      if systemd-detect-virt --vm --quiet; then
        selected=tty9
        other=tty12
      else
        selected=tty12
        other=tty9
      fi
      # kmscon --no-switchvt starts its child only after VT activation.
      previous=$(fgconsole) || exit 1
      trap 'chvt "$previous"' EXIT
      chvt "${selected#tty}" || exit 1
      unit="kmsconvt@$selected.service"
      systemctl is-active --quiet "$unit" &&
      test "$(systemctl show -p ActiveState --value "kmsconvt@$other.service")" = inactive &&
      pid=$(systemctl show -p MainPID --value "$unit") &&
      test "$pid" -gt 0 &&
      ps -ww --ppid "$pid" -o args= | grep -F '/usr/bin/journalctl --boot --follow --no-pager'
    wait: 30s
    on-fail: |
      systemctl show kmsconvt@tty9.service kmsconvt@tty12.service -p Id -p ActiveState -p SubState -p MainPID -p Result
      ps -ww -C kmscon,journalctl -o pid,ppid,args
      journalctl -b -u kmsconvt@tty9.service -u kmsconvt@tty12.service --no-pager -n 15
