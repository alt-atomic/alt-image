name: core defaults
description: What core adds on top of core-minimal
only:
  VERSION_ID: [ "~^[0-9]+$" ]
steps:
  - name: zram is active
    run: swapon --noheadings --show=NAME,TYPE
    expect:
      stdout: zram0
    on-fail: systemctl status systemd-zram-setup@zram0 --no-pager; cat /etc/systemd/zram-generator.conf

  - name: systemd-oomd runs with our limits
    run: oomctl
    expect:
      stdout: "Swap Used Limit: 80"
    on-fail: systemctl status systemd-oomd --no-pager; cat /usr/lib/systemd/oomd.conf.d/10-atomic-oomd.conf

  - name: sudo for wheel is enabled
    run: control sudowheel
    expect:
      stdout: enabled

  - name: firmware-linux is installed
    run: rpm -q firmware-linux

  - name: user namespaces are allowed
    run: sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || sysctl -n user.max_user_namespaces
    expect:
      stdout: "~^[1-9]"

  - name: default services are enabled
    only:
      VERSION_ID: [ "~^[0-9]+$" ]
    run: systemctl is-enabled libvirtd docker.socket systemd-oomd
    on-fail: systemctl status libvirtd docker.socket systemd-oomd --no-pager | head -60

  - name: journal console on tty12 is enabled
    run: systemctl is-enabled kmsconvt@tty12.service

  - name: journal runs on tty12 when activated
    run: |
      set -eu
      unit=kmsconvt@tty12.service
      systemctl is-active --quiet "$unit"

      # kmscon starts journalctl only when its VT is activated.
      previous=$(cat /sys/class/tty/tty0/active)
      trap 'chvt "${previous#tty}"' EXIT
      chvt 12

      pid=$(systemctl show -p MainPID --value "$unit")
      test "$pid" -gt 0
      ps -ww --ppid "$pid" -o args= | grep -Fx '/usr/bin/journalctl --boot --follow --no-pager'
    wait: 30s
    on-fail: |
      systemctl status kmsconvt@tty12.service --no-pager -l
      cat /sys/class/tty/tty0/active
      journalctl -b -u kmsconvt@tty12.service -n 30 --no-pager
