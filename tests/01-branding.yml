name: Branding
description: /etc/os-release is self-consistent and matches the release type

steps:
  - name: os-release is a symlink to /usr/lib/os-release
    run: test "$(readlink -f /etc/os-release)" = /usr/lib/os-release
    on-fail: ls -l /etc/os-release /usr/lib/os-release

  - name: ID names core
    run: . /etc/os-release && echo "$ID"
    expect:
      stdout: "~^alt-atomic-core-(nightly|stable)$"
    on-fail: cat /etc/os-release

  - name: ID_LIKE contains altlinux
    run: . /etc/os-release && echo "$ID_LIKE"
    expect:
      stdout: altlinux

  - name: nightly is marked as development
    only:
      RELEASE_TYPE: [ development ]
    run: . /etc/os-release && echo "$ID $VERSION_ID"
    expect:
      stdout: "~-nightly"

  - name: stable is marked as stable
    only:
      RELEASE_TYPE: [ stable ]
    run: . /etc/os-release && echo "$ID $VERSION_ID"
    expect:
      stdout: "~-stable"

  - name: VERSION_ID matches IMAGE_VERSION
    run: . /etc/os-release && test "$VERSION_ID" = "$IMAGE_VERSION"
    on-fail: grep -E '^(VERSION_ID|IMAGE_VERSION|BUILD_ID)=' /etc/os-release
